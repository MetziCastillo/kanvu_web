services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:80"

    volumes:
      - .:/var/www/html
      - laravel_storage:/var/www/html/storage
      - kanvu_vendor:/var/www/html/vendor

    restart: unless-stopped

volumes:
  laravel_storage:
  kanvu_vendor: