services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8000:80"
        volumes:
            - .:/var/www/html
            - laravel_storage:/var/www/html/storage
            - kanvu_vendor:/var/www/html/vendor
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped

    db:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-kanvu}
            MYSQL_USER: ${DB_USERNAME:-kanvu_user}
            MYSQL_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Configura DB_ROOT_PASSWORD en .env}
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'mysqladmin ping -h localhost -u root -p"$$MYSQL_ROOT_PASSWORD" --silent',
                ]
            interval: 5s
            timeout: 5s
            retries: 20
        restart: unless-stopped

    phpmyadmin:
        image: phpmyadmin:latest
        ports:
            - "127.0.0.1:8080:80"
        environment:
            PMA_HOST: db
            PMA_PORT: 3306
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped

volumes:
    laravel_storage:
    kanvu_vendor:
    mysql_data:
